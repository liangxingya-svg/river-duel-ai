<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>斗地主 · 出牌显示验收</title><link rel="stylesheet" href="doudizhu.css?v=044"></head><body>
<main id="tableView"><header class="table-header"><div class="room-heading"><h1>出牌显示验收</h1><p>只读布局 · 不连接真实房间</p></div><select id="case" aria-label="出牌牌组" style="width:135px;font-size:11px"><option value="eight">AA996666 · 8张</option><option value="ten">飞机带两对 · 10张</option><option value="twenty">剩余手牌 · 20张</option></select></header>
<div class="stage-bar"><span id="phaseLabel">四带两对 · 8张</span><span>底分20 · ×1</span><span>只读</span></div>
<section class="arena" id="arena"><div class="felt"><span class="felt-mark">RIVER DUEL<small>DOU DIZHU</small></span></div><div class="bottom-cards" id="bottomCards"></div>
<div class="player-seat seat-left"><div class="seat-main"><span class="avatar">农民</span><div><div class="seat-name">左侧出牌</div><div class="seat-amount">2.0K</div></div></div><div class="seat-status">点击牌面查看完整出牌</div></div>
<div class="player-seat seat-right"><div class="seat-main"><span class="avatar">农民</span><div><div class="seat-name">右侧出牌</div><div class="seat-amount">2.0K</div></div></div><div class="seat-status">同一组牌的右侧显示</div></div>
<div id="playLeft" class="played played-left"></div><div id="playRight" class="played played-right"></div><div id="playSelf" class="played played-self"></div>
<div class="player-seat seat-self"><div class="seat-main"><span class="avatar landlord">地主</span><div><div class="seat-name">本人出牌</div><div class="seat-amount">2.0K</div></div></div><div class="seat-status">同一组牌的下侧显示</div></div></section>
<section class="hand-panel"><div class="hand-heading"><span>八张应全部看清</span><span id="selectionLabel">长手牌可点击查看详情</span></div><p class="dialog-note">这是实际牌面组件的只读验收，不是模拟联机。</p></section><section class="action-panel"><div class="turn-line">七张A996666非法；八张AA996666合法。</div><div class="actions"><button class="primary" id="detailOpen">查看完整出牌</button></div><p id="actionNote">牌型和张数明确标注，首张与末张不会被居中裁切。</p></section><div class="table-notice">可切换牌组检查长手牌。</div></main>
<dialog id="playedDialog"><div class="dialog-heading"><h2 id="playedTitle">完整出牌</h2><button id="closePlayed" class="icon-button" aria-label="关闭出牌详情">×</button></div><div id="playedCards" class="open-hand-cards"></div><p id="playedNotice" class="dialog-note"></p></dialog>
<script src="doudizhu.js?v=044"></script><script src="doudizhu-cards.js?v=044"></script><script>
const C=window.DoudizhuCards,D=window.Doudizhu,$=id=>document.getElementById(id),cases={eight:[12,25,7,20,4,17,30,43],ten:[1,14,27,2,15,28,3,16,4,17],twenty:Array.from({length:20},(_,i)=>i)};let current=[];
function detail(){const label=D.classify(current)[0]?.label||'剩余手牌';$('playedTitle').textContent=label+' · '+current.length+'张';$('playedCards').replaceChildren(...current.map(c=>C.card(c)));$('playedNotice').textContent='完整牌面，没有省略。';$('playedDialog').showModal()}
function render(){current=D.sort(cases[$('case').value]);const label=D.classify(current)[0]?.label||'剩余手牌';$('phaseLabel').textContent=label+' · '+current.length+'张';for(const id of ['playLeft','playRight','playSelf'])C.mount($(id),current.map(c=>C.card(c)),{label,onOpen:detail})}
$('bottomCards').replaceChildren(...[26,19,33].map(c=>C.card(c)));$('case').onchange=render;$('detailOpen').onclick=detail;$('closePlayed').onclick=()=>$('playedDialog').close();window.addEventListener('resize',()=>{for(const id of ['playLeft','playRight','playSelf'])C.fit($(id))});render();
</script></body></html>

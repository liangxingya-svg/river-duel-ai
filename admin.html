<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1712"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>河牌对决 · 房间管理</title><link rel="stylesheet" href="admin.css?v=039"></head>
<body><header class="admin-header"><a href="index.html" class="brand"><span>♠</span> RIVER DUEL</a><span class="header-label">房间管理</span><button id="logout" hidden>退出</button></header>
<main><section id="loginPanel" class="login-panel"><span class="eyebrow">OWNER ACCESS</span><h1>照看每一桌。</h1><p class="muted">查看在线房间、玩家收益，管理开桌与关闭。</p><form id="loginForm"><label for="adminKey">管理口令</label><input id="adminKey" type="password" autocomplete="current-password" required maxlength="256" placeholder="输入站点所有者的管理口令"><button id="loginButton" class="primary">进入管理</button></form><p id="loginNotice" class="notice" role="status"></p><p class="fine-print">仅管理好友房。本机练习房不上传，也不会出现在这里。</p></section>
<section id="dashboard" hidden><div class="page-heading"><div><span class="eyebrow">ROOM OVERVIEW</span><h1>正在开着的桌。</h1></div><button id="refresh" class="icon-button" aria-label="刷新房间"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7a9 9 0 1 0 1 8M20 3v5h-5"/></svg></button></div>
<div class="metrics"><div><strong id="openCount">—</strong><span>未关闭房间</span></div><div><strong id="playingCount">—</strong><span>正在打牌</span></div><div><strong id="onlineCount">—</strong><span>真人在线席位</span></div></div>
<div class="filters"><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="roomSearch" aria-label="搜索房间或玩家" placeholder="房间名、房间号或玩家"></label><label for="roomFilter" class="sr-only">房间状态</label><select id="roomFilter"><option value="open">未关闭</option><option value="online">有人在线</option><option value="offline">无人在线</option><option value="closed">已关闭</option><option value="all">全部房间</option></select></div>
<div class="list-meta"><span id="listCount"></span><span id="lastUpdated"></span></div><p id="dashboardNotice" class="notice" role="status"></p><div id="roomList" class="room-list"></div><p class="fine-print">每10秒更新 · 连续无真人在线24小时自动解散，AI 不计在线人数。</p></section></main>
<dialog id="roomDetail"><div class="dialog-heading"><div><span class="eyebrow">ROOM DETAILS</span><h2 id="detailTitle"></h2></div><button id="closeDetail" class="close-button" aria-label="关闭房间详情">×</button></div><p id="detailMeta" class="muted"></p><div id="detailPlayers"></div><p class="fine-print">按已结算净收益从高到低排序。自动补齐与手动补入不计盈利。</p></dialog>
<dialog id="roomConfirm"><div class="dialog-heading"><h2 id="confirmTitle"></h2><button id="cancelRoomX" class="close-button" aria-label="取消房间操作">×</button></div><p id="confirmText"></p><p id="confirmRoomName" class="confirm-room"></p><p id="confirmNotice" class="notice" role="status"></p><div class="dialog-actions"><button id="cancelRoom">取消</button><button id="confirmRoom" class="danger">确认关闭</button></div></dialog>
<script src="online-config.js?v=005-node1"></script><script src="money-format.js?v=038"></script><script src="room-names.js?v=038"></script><script src="admin.js?v=047"></script></body></html>
